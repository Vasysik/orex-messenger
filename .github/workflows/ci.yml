name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  flutter:
    name: Flutter checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android debug build
        run: flutter build apk --debug

      - name: Windows debug build
        run: flutter build windows --debug
