name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build LiveKit E2EE worker
        shell: bash
        run: |
          sdk_dir="$RUNNER_TEMP/livekit-client-sdk-flutter"
          rm -rf "$sdk_dir"
          mkdir -p "$sdk_dir"
          cd "$sdk_dir"
          git init -q
          git remote add origin https://github.com/livekit/client-sdk-flutter.git
          git fetch --depth 1 origin 79921c0ae53e40ed5a0a0bf29a4ecc5a431cfe4e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "79921c0ae53e40ed5a0a0bf29a4ecc5a431cfe4e"
          grep -q '^version: 2.9.0-dev.0$' pubspec.yaml
          flutter pub get
          dart compile js web/e2ee.worker.dart \
            -o "$GITHUB_WORKSPACE/web/e2ee.worker.dart.js" -m

      - name: Verify Web security contract
        shell: bash
        run: |
          test -s web/e2ee.worker.dart.js
          grep -q "Content-Security-Policy:" web/_headers
          grep -q "Strict-Transport-Security:" web/_headers
          grep -q "X-Content-Type-Options: nosniff" web/_headers
          grep -q "Referrer-Policy: no-referrer" web/_headers

      - name: Web release build
        run: >
          flutter build web --no-pub --no-web-resources-cdn
          --dart-define=OREX_ENV=production
          --dart-define=OREX_DEBUG_LOGS=false

      - name: Android debug build
        run: flutter build apk --debug --no-pub

      - name: Android release build
        env:
          OREX_ALLOW_UNSIGNED_ANDROID_RELEASE: "true"
          OREX_ALLOW_ANDROID_RELEASE_WITHOUT_PUSH: "true"
        run: >
          flutter build apk --release --split-per-abi --no-pub
          --dart-define=OREX_ENV=production
          --dart-define=OREX_DEBUG_LOGS=false

      - name: Windows release build
        run: >
          flutter build windows --release --no-pub
          --dart-define=OREX_ENV=production
          --dart-define=OREX_DEBUG_LOGS=false
