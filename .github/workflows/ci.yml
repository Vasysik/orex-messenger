name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Web release build
        run: >
          flutter build web --no-pub
          --dart-define=OREX_ENV=production
          --dart-define=OREX_DEBUG_LOGS=false

      - name: Android debug build
        run: flutter build apk --debug --no-pub

      - name: Android release build
        env:
          OREX_ALLOW_UNSIGNED_ANDROID_RELEASE: "true"
        run: >
          flutter build apk --release --split-per-abi --no-pub
          --dart-define=OREX_ENV=production
          --dart-define=OREX_DEBUG_LOGS=false

      - name: Windows release build
        run: >
          flutter build windows --release --no-pub
          --dart-define=OREX_ENV=dev
          --dart-define=OREX_HOMESERVER=https://vasys.ru
          --dart-define=OREX_JWT_SERVICE=https://jwt.vasys.ru
          --dart-define=OREX_DEBUG_LOGS=false
