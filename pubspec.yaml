name: orex_messenger
description: "Orex Messenger — тёплый ореховый мессенджер на MatrixRTC + LiveKit."
publish_to: "none"
version: 0.4.3+10

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.41.6"

# После первого `flutter pub get` закоммитьте новый pubspec.lock из той же
# Flutter toolchain, которой собирается пререлиз. Analyze/test/smoke обязательны.
dependencies:
  flutter:
    sdk: flutter

  # Matrix Dart SDK (Famedly)
  matrix: 8.1.0
  # E2EE (vodozemac заменил olm). Совместимость проверяется с Matrix 8.x:
  flutter_vodozemac: 0.5.0

  # LiveKit (нативные звонки в Orex UI поверх lk-jwt-service)
  # Must match the E2EE worker source ref used by CI.
  livekit_client: 2.9.0-dev.0
  # WebRTC-примитивы для WebRTCDelegate модуля VoIP (MatrixRTC-сигналинг).
  flutter_webrtc: 1.5.2

  # Короткие звуки уведомлений, входящих вызовов и голосовых каналов.
  audioplayers: 6.8.1
  record: 7.1.1 # быстрый тест микрофона/амплитуда dBFS
  webrtc_interface: 1.5.1 # типы MediaDevices/RTCPeerConnection для делегата

  # Сеть/утилиты
  http: 1.6.0
  path: 1.9.1
  file_picker: 11.0.2 # Android path-traversal fix; 11.x uses static FilePicker methods
  shared_preferences: 2.5.5 # сохранение темы
  package_info_plus: 9.0.1 # последняя ветка, совместимая с win32 5.x/file_picker 11
  desktop_drop: 0.7.1 # Drag-and-drop файлов
  open_app_file: 4.0.5 # Открытие файлов на Android/Windows

  # Локальный кэш для «мгновенного» старта.
  path_provider: 2.1.6
  sqflite_sqlcipher: 3.4.0
  flutter_secure_storage: 9.2.4
  # Matrix 8.1.0 currently constrains package:sqlite3 to the 2.x line.
  # Keep the matching SQLCipher carrier until Matrix moves to sqlite3 3.x.
  sqlite3: 2.9.4
  sqlcipher_flutter_libs: 0.6.8
  sqflite: 2.4.3
  sqflite_common_ffi: 2.3.7+1
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

# Генерация иконок приложения из assets/icon/app_icon.png:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false                 # iOS-папки нет (создавали web,android,windows)
  web:
    generate: true
  windows:
    generate: true
    icon_size: 256
  # remove_alpha_ios: true   # включите вместе с ios: true, если добавите iOS

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/sounds/
    - assets/mascot/squirrel.png
