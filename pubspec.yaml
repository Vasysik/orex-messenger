name: orex_messenger
description: "Orex Messenger — тёплый ореховый мессенджер на Matrix + Element Call."
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.24.0"

# Версии — «не ниже актуальных на момент сборки». Экосистема Matrix меняется
# часто; после первой удачной сборки закрепите версии. matrix резолвится в 7.3.x.
dependencies:
  flutter:
    sdk: flutter

  # Matrix Dart SDK (Famedly)
  matrix: ^7.2.0
  # E2EE (vodozemac заменил olm). Совместим с matrix 7.x:
  flutter_vodozemac: ^0.5.0

  # LiveKit (нативные звонки в нашем UI, поверх вашего lk-jwt-service)
  livekit_client: ^2.8.0
  # WebRTC-примитивы для WebRTCDelegate модуля VoIP (MatrixRTC-сигналинг).
  flutter_webrtc: ^1.5.2

  # Короткие звуки уведомлений, входящих вызовов и голосовых каналов.
  audioplayers: ^6.1.0
  record: ^7.1.1          # быстрый тест микрофона/амплитуда dBFS
  webrtc_interface: ^1.5.0   # типы MediaDevices/RTCPeerConnection для делегата

  # Сеть/утилиты
  http: ^1.2.0
  path: ^1.9.0
  file_picker: ^8.0.0        # выбор аватара
  shared_preferences: ^2.2.0 # сохранение темы
  desktop_drop: ^0.5.0       # Drag-and-drop файлов
  open_app_file: ^4.0.4    # Открытие файлов на Android/Windows

  # Локальный кэш для «мгновенного» старта.
  path_provider: ^2.1.0
  sqflite_sqlcipher: ^3.4.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

# Генерация иконок приложения из assets/icon/app_icon.png:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false                 # iOS-папки нет (создавали web,android,windows)
  web:
    generate: true
  windows:
    generate: true
    icon_size: 256
  # remove_alpha_ios: true   # включите вместе с ios: true, если добавите iOS

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/sounds/
    # - assets/mascot/squirrel.png   # добавите, когда будет ассет маскота
