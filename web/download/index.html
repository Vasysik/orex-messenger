<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1c140e">
  <meta name="description" content="Скачать Orex Messenger для Windows и Android.">
  <title>Скачать Orex Messenger</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="download.css">
  <script src="download.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="download-card" aria-labelledby="download-title">
      <img
        class="app-icon"
        src="../icons/Icon-192.png"
        width="96"
        height="96"
        alt="Иконка Orex Messenger"
      >

      <h1 id="download-title">Orex Messenger</h1>
      <p class="slogan">Тепло. Быстро. Децентрализованно.</p>
      <p id="release-status" class="release-status" aria-live="polite">
        Получаем актуальную стабильную версию…
      </p>

      <div class="download-actions" aria-label="Скачать Orex Messenger">
        <a
          id="download-windows"
          class="download-button is-disabled"
          href="#"
          aria-disabled="true"
        >
          <span>Windows x64</span>
          <small id="size-windows">Подготавливаем ссылку…</small>
        </a>

        <a
          id="download-android-arm64"
          class="download-button is-disabled"
          href="#"
          aria-disabled="true"
        >
          <span>Android · ARM64</span>
          <small id="size-android-arm64">Для большинства современных устройств</small>
        </a>

        <a
          id="download-android-armv7"
          class="download-button download-button-secondary is-disabled"
          href="#"
          aria-disabled="true"
        >
          <span>Android · ARMv7</span>
          <small id="size-android-armv7">Для старых 32-битных устройств</small>
        </a>
      </div>

      <a class="web-link" href="/">Открыть Web-версию</a>
      <p class="prerelease-note">Orex пока находится в стадии prerelease.</p>
    </section>
  </main>
</body>
</html>
