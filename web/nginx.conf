server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # nginx emits ETag/Last-Modified for static files. "no-cache" below means
  # "store it, but revalidate before reuse", not "do not store". Unchanged
  # files therefore come back as 304 instead of being downloaded again.
  etag on;
  if_modified_since exact;

  # The tiny application shell must always be checked after navigation/deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Compatibility with older deployments. Never pin the generated worker.
  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # JS/WASM/JSON filenames are not content-hashed by Flutter. Revalidate them
  # on every navigation so a new deploy becomes visible immediately; unchanged
  # files normally use a cheap conditional request/304 response.
  location ~* \.(?:js|wasm|json)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # UI assets get a short fresh lifetime so reloads do not refetch icons/images.
  # Five minutes bounds how long a same-name asset can stay stale after a deploy.
  location ~* ^/(assets|icons)/ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    try_files $uri =404;
  }

  location = /favicon.png {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    try_files $uri =404;
  }

  # /download is a Flutter client-side route. Handle it explicitly so even an
  # accidental build/web/download directory cannot become an nginx 403.
  location = /download {
    return 308 /download/;
  }

  location = /download/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  # SPA fallback. Do not test "$uri/": an on-disk directory can otherwise win
  # over a Flutter route and produce a directory-listing 403.
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri /index.html;
  }
}
