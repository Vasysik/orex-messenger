server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The Flutter shell must always be revalidated so a deploy cannot leave an
  # old application entry point pinned in the browser.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Brand images and bundled image assets are safe to keep across reloads.
  # A one-day lifetime avoids the visible auth-logo refetch while still making
  # asset replacements converge quickly without versioned filenames.
  location ~* ^/(assets|icons)/ {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location = /favicon.png {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Flutter owns client-side routes such as /download/. Unknown document paths
  # fall back to the same application shell instead of requiring a second HTML
  # frontend.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
